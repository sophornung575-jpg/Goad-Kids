<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan Debug</title>
<style>
body{font-family:Arial;padding:16px;max-width:400px;margin:0 auto}
#log{background:#f0f0f0;padding:10px;border-radius:8px;font-size:12px;font-family:monospace;min-height:100px;white-space:pre-wrap;margin:10px 0}
video{width:100%;border-radius:8px;display:none}
button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:22px;font-size:15px;font-weight:bold;cursor:pointer;background:#4a90d9;color:#fff}
</style>
</head>
<body>
<h3>Scanner Debug</h3>
<video id="vid" playsinline autoplay muted></video>
<div id="log">Checking environment...\n</div>
<button onclick="startScan()">Start Camera</button>
<button onclick="stopScan()" style="background:#e53e3e">Stop</button>

<script>
var log = document.getElementById('log');
var vid = document.getElementById('vid');
var stream = null;
var timer = null;
var active = false;

function addLog(msg) {
    log.textContent += msg + '\n';
    log.scrollTop = log.scrollHeight;
}

// Environment check
addLog('Protocol: ' + location.protocol);
addLog('Host: ' + location.hostname);
addLog('UserAgent: ' + navigator.userAgent.substring(0,60));
addLog('BarcodeDetector: ' + (typeof BarcodeDetector !== 'undefined' ? 'YES ✅' : 'NO ❌'));
addLog('getUserMedia: ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'YES ✅' : 'NO ❌'));

// Load jsQR
addLog('\nLoading jsQR...');
var s = document.createElement('script');
s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
s.onload = function() { addLog('jsQR loaded ✅ v' + (jsQR.version||'?')); };
s.onerror = function() {
    addLog('jsQR CDN1 failed, trying CDN2...');
    var s2 = document.createElement('script');
    s2.src = 'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js';
    s2.onload = function() { addLog('jsQR loaded via unpkg ✅'); };
    s2.onerror = function() { addLog('jsQR FAILED to load ❌'); };
    document.head.appendChild(s2);
};
document.head.appendChild(s);

function startScan() {
    if (active) return;
    addLog('\nStarting camera...');
    navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width:{ideal:1280}, height:{ideal:720} }
    }).then(function(s) {
        stream = s; active = true;
        vid.srcObject = s; vid.style.display = 'block';
        vid.play();
        vid.onloadedmetadata = function() {
            addLog('Camera: ' + vid.videoWidth + 'x' + vid.videoHeight);
            addLog('Scanning...');
            doScan();
        };
    }).catch(function(e) { addLog('Camera error: ' + e.message); });
}

function doScan() {
    if (!active) return;
    if (vid.readyState < 2) { timer = requestAnimationFrame(doScan); return; }
    
    var c = document.createElement('canvas');
    c.width = vid.videoWidth; c.height = vid.videoHeight;
    c.getContext('2d').drawImage(vid, 0, 0);
    
    // Try BarcodeDetector
    if (typeof BarcodeDetector !== 'undefined') {
        new BarcodeDetector({formats:['qr_code','ean_13','code_128','upc_a']})
        .detect(c).then(function(codes) {
            if (codes.length > 0) {
                stopScan();
                addLog('✅ BarcodeDetector found: ' + codes[0].rawValue);
            } else {
                timer = requestAnimationFrame(doScan);
            }
        }).catch(function(e) { addLog('BD error: '+e.message); timer = requestAnimationFrame(doScan); });
    }
    // Try jsQR
    else if (typeof jsQR !== 'undefined') {
        var d = c.getContext('2d').getImageData(0,0,c.width,c.height);
        var result = jsQR(d.data, d.width, d.height);
        if (result) {
            stopScan();
            addLog('✅ jsQR found: ' + result.data);
        } else {
            setTimeout(doScan, 150);
        }
    } else {
        addLog('No scanner available, waiting for jsQR...');
        setTimeout(doScan, 500);
    }
}

function stopScan() {
    active = false;
    if (timer) { cancelAnimationFrame(timer); timer = null; }
    if (stream) { stream.getTracks().forEach(t=>t.stop()); stream = null; }
    vid.style.display = 'none';
}
</script>
</body>
</html>
