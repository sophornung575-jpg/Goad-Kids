<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goat Kids – Marketing Summary</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f27;--mut:#6b7280;--bd:#e5e7eb;--ad:#4f6a94;--post:#2f7d62;--video:#b98a3a;--acc:#111827}
[data-theme=dark]{--bg:#0f1218;--card:#181c25;--tx:#e8eaf0;--mut:#8b93a3;--bd:#262c38;--acc:#e8eaf0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,'Noto Sans Khmer','Khmer OS Battambang','Leelawadee UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:18px;margin:0;flex:1}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--acc);color:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi,.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:20px;margin-top:2px}.kpi span{color:var(--mut);font-size:12px}
.kpi i{font-style:normal;font-size:12px}.up{color:#2f7d62}.dn{color:#b0524f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card h2{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;overflow:hidden}
.dh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--bd);font-weight:600}
.dh small{font-weight:400;color:var(--mut)}
.it{display:grid;grid-template-columns:70px 1fr 170px auto;gap:8px;padding:8px 12px;border-top:1px solid var(--bd);align-items:center}
.it:first-of-type{border-top:0}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;text-align:center}
.nums{color:var(--mut);font-size:12px}.best{color:#2f7d62;font-weight:700}
.x{border:0;background:none;color:var(--mut);padding:2px 6px}
#form{display:none;margin-bottom:14px}
#form.show{display:block}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.f label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.sp{font-size:10px;color:var(--mut);text-align:right}.sp svg{height:38px}
@media(max-width:620px){.it{grid-template-columns:70px 1fr auto}.sp{grid-column:1/-1}}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;font-weight:600}.tabs button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools input{width:150px}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2f7d62;transition:width .3s}
details.blk{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;overflow:hidden}
details.blk summary{padding:11px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-weight:600;list-style:none}
details.blk summary::-webkit-details-marker{display:none}
details.blk summary span{color:var(--mut);font-weight:400;font-size:12px}
.tk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--bd)}
.tk input[type=checkbox]{width:20px;height:20px;accent-color:#2f7d62;flex:none}
.tk.done .tn{text-decoration:line-through;color:var(--mut)}.tk .tn{flex:1}.tk small{color:var(--mut);font-size:11px;white-space:nowrap}
.addt{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--bd)}.addt input{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:10px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:16px}
textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.row{padding:10px 12px;border-top:1px solid var(--bd)}.rh{display:flex;gap:8px;align-items:center;margin-bottom:6px}.rh .ok{color:#2f7d62;font-size:12px;flex:1}.rh .todo{color:var(--mut);font-size:12px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.chip{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:3px 10px;font-size:12px}.chip b{cursor:pointer;color:var(--mut);margin-left:4px}
.srch{position:relative;margin-bottom:6px}.srch input{width:100%}.dd{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-height:260px;overflow:auto}
.dd[hidden]{display:none}.dd div{padding:8px 10px;cursor:pointer;border-top:1px solid var(--bd)}.dd div:first-child{border-top:0}.dd div:hover{background:var(--bg)}.dd small{color:var(--mut)}.dd .typed{color:var(--mut);font-style:italic}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts input{flex:1 1 200px}
.ths{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1 1 220px}
.pth{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 8px 4px 4px}
.pth img,.pth .noimg{width:38px;height:38px;border-radius:6px;object-fit:cover;background:var(--bd);flex:none}
.pn{font-size:12px;line-height:1.25}.pn small{color:var(--mut)}.pth b{cursor:pointer;color:var(--mut)}
.ths.big{margin-bottom:10px}.ths.big .pth img,.ths.big .pth .noimg{width:64px;height:64px}.ths.big .pn{font-size:13px}
.empty{text-align:center;color:var(--mut);padding:30px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Goat Kids – Marketing Summary</h1>
  <div class="seg" id="range"><button data-d="7" class="on">7d</button><button data-d="14">14d</button><button data-d="30">30d</button></div>
  <button id="addBtn" class="pri">+ Add result</button>
  <button id="gear" title="Settings">Settings</button><button id="theme">Theme</button>
</header>

<div class="tabs"><button id="tabS" class="on">Summary</button><button id="tabT">Daily Tasks</button></div>
<div id="viewSummary">
<div id="form" class="card">
  <div class="f">
    <label>Date<input type="date" id="fDate"></label>
    <label>Type<select id="fType"><option value="ad">Ad</option><option value="post">Post</option><option value="video">Video</option></select></label>
    <label style="grid-column:span 2">Name / product<input id="fName" placeholder="e.g. Dress 110 promo"></label>
    <label style="grid-column:span 2">Post link<input id="fLink" placeholder="https://..." inputmode="url"></label>
    <label id="lSpend">Spend $<input type="number" id="fSpend" min="0" step="0.01"></label>
    <label id="lReach">Reach<input type="number" id="fReach" min="0"></label>
    <label id="lEng">Clicks<input type="number" id="fEng" min="0"></label>
    <label>Messages<input type="number" id="fMsgs" min="0"></label>
    <label>Orders<input type="number" id="fOrders" min="0"></label>
  </div>
  <div style="margin-top:10px;display:flex;gap:8px"><button class="pri" id="save">Save</button><button id="cancel">Cancel</button></div>
</div>

<div class="kpis" id="kpis"></div>

<div class="card" style="margin-bottom:14px"><h2>Monthly target <small style="color:var(--mut)">daily target × days in the month</small></h2>
  <div class="f" style="max-width:420px;margin-bottom:10px"><label>Videos / day<input type="number" id="tgV" min="0"></label><label>Photo posts / day<input type="number" id="tgP" min="0"></label><label>Lives / day<input type="number" id="tgL" min="0"></label></div>
  <div class="kpis" id="tgTiles"></div><div id="cTgt"></div></div>
<div class="grid">
  <div class="card"><h2>Trend <select id="metric"></select></h2><div id="cTrend"></div></div>
  <div class="card"><h2>By type per day <small style="color:var(--mut)" id="mName"></small></h2><div id="cStack"></div>
    <div class="leg"><span><i style="background:var(--ad)"></i>Ad</span><span><i style="background:var(--post)"></i>Post</span><span><i style="background:var(--video)"></i>Video</span></div></div>
  <div class="card"><h2>Orders per $1 spent / per 1,000 reach</h2><div id="cEff"></div></div>
  <div class="card"><h2>Top items <small style="color:var(--mut)">by orders</small></h2><div id="cTop"></div></div>
</div>

<h2 style="font-size:15px;margin:18px 0 8px">Daily list</h2>
<div id="list"></div>
</div>
<div id="viewTasks" style="display:none">
  <div class="tools">
    <button id="dPrev">◀</button><input type="date" id="tDate" style="width:150px"><button id="dNext">▶</button><button id="dToday">Today</button>
    <input id="tUser" placeholder="Your name" style="margin-left:auto">
  </div>
  <div class="card" style="margin-bottom:12px">
    <h2>Progress <span id="tPct"></span></h2><div class="bar"><i id="tBar" style="width:0"></i></div>
  </div>
  <div class="card" style="margin-bottom:12px"><h2>Daily target met – last 30 days</h2><div id="tChart"></div></div>
  <div id="tBlocks"></div>
</div>
</div>

<script>
var KEY='goatMarketingSummary';
var COL={ad:'#4f6a94',post:'#2f7d62',video:'#b98a3a'};
var LBL={ad:'AD',post:'POST',video:'VIDEO'};
var METRICS={spend:'Spend $',reach:'Reach / views',eng:'Clicks / likes',msgs:'Messages',orders:'Orders'};
var data=[],days=7;
try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function $(i){return document.getElementById(i)}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){n=+n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':(Math.round(n*100)/100).toString()}
function dayList(n,offset){var a=[],t=new Date();t.setDate(t.getDate()-(offset||0));for(var i=n-1;i>=0;i--){var d=new Date(t);d.setDate(t.getDate()-i);a.push(iso(d))}return a}
function sum(items,k){return items.reduce(function(s,x){return s+(+x[k]||0)},0)}

/* ---------- SVG charts ---------- */
var W=560,H=210,PL=38,PB=26,PT=10,PR=8;
function axes(max,labels){
  var s='',steps=4,i;
  for(i=0;i<=steps;i++){var y=PT+(H-PT-PB)*(1-i/steps);
    s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--bd)"/>'+
       '<text x="'+(PL-5)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--mut)">'+fmt(max*i/steps)+'</text>'}
  var n=labels.length,step=Math.ceil(n/7);
  labels.forEach(function(l,i){if(i%step===0||i===n-1){
    var x=PL+(W-PL-PR)*(i+.5)/n;
    s+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--mut)">'+l.slice(5).replace('-','/')+'</text>'}});
  return s}
function niceMax(m){if(m<=0)return 4;var p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return(f<=1?1:f<=2?2:f<=4?4:f<=5?5:10)*p}
function lineChart(el,labels,vals,color){
  var max=niceMax(Math.max.apply(null,vals)),n=labels.length,pts=[];
  var s='<svg viewBox="0 0 '+W+' '+H+'">'+axes(max,labels);
  vals.forEach(function(v,i){pts.push([PL+(W-PL-PR)*(i+.5)/n,PT+(H-PT-PB)*(1-v/max),v])});
  var path=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
  var area=path+' L'+pts[n-1][0]+' '+(H-PB)+' L'+pts[0][0]+' '+(H-PB)+'Z';
  s+='<path d="'+area+'" fill="'+color+'" opacity=".12"/><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(n>14?2.5:3.5)+'" fill="'+color+'"><title>'+labels[i]+': '+p[2]+'</title></circle>'});
  el.innerHTML=s+'</svg>'}
function stackChart(el,labels,series){
  var n=labels.length,tot=labels.map(function(_,i){return series.reduce(function(s,x){return s+x.v[i]},0)});
  var max=niceMax(Math.max.apply(null,tot)),bw=Math.min(34,(W-PL-PR)/n*.65);
  var s='<svg viewBox="0 0 '+W+' '+H+'">'+axes(max,labels);
  labels.forEach(function(l,i){
    var x=PL+(W-PL-PR)*(i+.5)/n-bw/2,y=H-PB;
    series.forEach(function(se){var h=(H-PT-PB)*se.v[i]/max;if(h<=0)return;y-=h;
      s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" fill="'+se.c+'" rx="2"><title>'+l+' '+se.n+': '+se.v[i]+'</title></rect>'})});
  el.innerHTML=s+'</svg>'}
function hbars(el,rows,unit){
  if(!rows.length){el.innerHTML='<div class="empty">No data</div>';return}
  var max=Math.max.apply(null,rows.map(function(r){return r.v}))||1,h=rows.length*30+6;
  var s='<svg viewBox="0 0 '+W+' '+h+'">';
  rows.forEach(function(r,i){var y=i*30+4,w=(W-210)*r.v/max;
    s+='<text x="0" y="'+(y+15)+'" font-size="12" fill="var(--tx)">'+esc((function(n){return n.length>22?n.slice(0,21)+'…':n})(tr(r.n)))+'</text>'+
       '<rect x="160" y="'+y+'" width="'+Math.max(w,2)+'" height="20" rx="4" fill="'+r.c+'"/>'+
       '<text x="'+(166+w)+'" y="'+(y+15)+'" font-size="12" fill="var(--mut)">'+fmt(r.v)+(unit||'')+'</text>'});
  el.innerHTML=s+'</svg>'}

function spark(x,dl,m){
  var vals=dl.map(function(d){return sum(data.filter(function(y){return y.date===d&&y.type===x.type&&y.name===x.name}),m)});
  var has=dl.map(function(d){return data.some(function(y){return y.date===d&&y.type===x.type&&y.name===x.name})});
  var n=dl.length,w=170,h=38,max=Math.max.apply(null,vals)||1,pts=[];
  vals.forEach(function(v,i){if(has[i])pts.push([4+(w-8)*(n>1?i/(n-1):.5),h-6-(h-12)*v/max,i])});
  var cur=dl.indexOf(x.date),c=COL[x.type];
  var s='<svg viewBox="0 0 '+w+' '+h+'"><line x1="4" x2="'+(w-4)+'" y1="'+(h-6)+'" y2="'+(h-6)+'" stroke="var(--bd)"/>';
  if(pts.length>1)s+='<path d="'+pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="2"/>';
  pts.forEach(function(p){var on=p[2]===cur;s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(on?4:2.2)+'" fill="'+(on?c:'var(--card)')+'" stroke="'+c+'" stroke-width="1.5"><title>'+dl[p[2]]+': '+vals[p[2]]+'</title></circle>'});
  return s+'</svg><div>'+METRICS[m]+' · '+pts.length+' day'+(pts.length>1?'s':'')+'</div>'}
/* ---------- render ---------- */
function inRange(list){return data.filter(function(x){return list.indexOf(x.date)>-1})}
function render(){
  var dl=dayList(days),prev=dayList(days,days),cur=inRange(dl),old=inRange(prev);
  /* KPIs */
  var K=[['spend','Spend','$'],['reach','Reach / views',''],['msgs','Messages',''],['orders','Orders','']];
  $('kpis').innerHTML=K.map(function(k){var a=sum(cur,k[0]),b=sum(old,k[0]),ch='';
    if(b>0){var p=Math.round((a-b)/b*100);var good=k[0]==='spend'?false:p>=0;ch='<i class="'+(p>=0?'up':'dn')+'">'+(p>=0?'▲':'▼')+Math.abs(p)+'% vs prev</i>'}
    return '<div class="kpi"><span>'+k[1]+' ('+days+'d)</span><b>'+k[2]+fmt(a)+'</b>'+ch+'</div>'}).join('')+
    '<div class="kpi"><span>Cost per order</span><b>'+(sum(cur,'orders')?'$'+(sum(cur,'spend')/sum(cur,'orders')).toFixed(2):'–')+'</b></div>';
  /* trend */
  var m=$('metric').value;
  lineChart($('cTrend'),dl,dl.map(function(d){return sum(cur.filter(function(x){return x.date===d}),m)}),'#4f6a94');
  /* stack */
  $('mName').textContent=METRICS[m];
  stackChart($('cStack'),dl,['ad','post','video'].map(function(t){return{n:LBL[t],c:COL[t],v:dl.map(function(d){return sum(cur.filter(function(x){return x.date===d&&x.type===t}),m)})}}));
  /* efficiency by type */
  var eff=[];['ad','post','video'].forEach(function(t){var it=cur.filter(function(x){return x.type===t});
    if(sum(it,'spend')>0)eff.push({n:LBL[t]+' orders / $1',c:COL[t],v:sum(it,'orders')/sum(it,'spend')});
    if(sum(it,'reach')>0)eff.push({n:LBL[t]+' orders / 1k reach',c:COL[t],v:sum(it,'orders')/sum(it,'reach')*1000})});
  hbars($('cEff'),eff,'');
  /* top items */
  var top=cur.slice().sort(function(a,b){return(+b.orders||0)-(+a.orders||0)}).slice(0,6).filter(function(x){return x.orders>0})
    .map(function(x){return{n:LBL[x.type]+' · '+x.name,c:COL[x.type],v:+x.orders}});
  hbars($('cTop'),top,'');
  /* daily list */
  var ds=dl.slice().reverse().filter(function(d){return cur.some(function(x){return x.date===d})});
  $('list').innerHTML=ds.length?ds.map(function(d){
    var it=cur.filter(function(x){return x.date===d}),bestId=null,bo=0;
    it.forEach(function(x){if((+x.orders||0)>bo){bo=+x.orders;bestId=x.id}});
    return '<div class="day"><div class="dh"><span>'+dateStr(d)+'</span>'+
      '<small>$'+fmt(sum(it,'spend'))+' · reach '+fmt(sum(it,'reach'))+' · msgs '+fmt(sum(it,'msgs'))+' · orders '+fmt(sum(it,'orders'))+'</small></div>'+
      it.map(function(x){var el=x.type==='ad'?'clicks':x.type==='video'?'likes':'likes';var rl=x.type==='video'?'views':'reach';
        return '<div class="it"><span class="tag" style="background:'+COL[x.type]+'">'+LBL[x.type]+'</span>'+
        '<div><div>'+esc(x.name||'(no name)')+(x.id===bestId?' <span class="best">Best</span>':'')+'</div>'+
        '<div class="nums">'+(x.type==='ad'?'$'+fmt(x.spend)+' spend · ':'')+fmt(x.reach)+' '+rl+' · '+fmt(x.eng)+' '+el+' · '+fmt(x.msgs)+' msgs · '+fmt(x.orders)+' orders'+(x.link?' · <a href="'+esc(x.link)+'" target="_blank" rel="noopener">Link</a>':'')+'</div></div><div class="sp">'+spark(x,dl,m)+'</div>'+
        '<button class="x" data-del="'+x.id+'" title="Delete">✕</button></div>'}).join('')+'</div>'}).join(''):
    '<div class="empty">No results in this range yet.<br><br><button id="demo">Load sample data</button></div>';
  var dm=$('demo');if(dm)dm.onclick=sample;
}

/* ---------- form ---------- */
function typeLabels(){var t=$('fType').value;
  $('lSpend').style.display=t==='ad'?'':'none';
  $('lReach').firstChild.nodeValue=t==='video'?'Views':'Reach';
  $('lEng').firstChild.nodeValue=t==='ad'?'Clicks':'Likes'}
$('fType').onchange=typeLabels;
$('addBtn').onclick=function(){$('fDate').value=iso(new Date());typeLabels();$('form').classList.add('show')};
$('cancel').onclick=function(){$('form').classList.remove('show')};
$('save').onclick=function(){
  var t=$('fType').value;
  data.push({id:'m'+Date.now().toString(36),date:$('fDate').value||iso(new Date()),type:t,name:$('fName').value.trim(),link:/^https?:\/\//i.test($('fLink').value.trim())?$('fLink').value.trim():'',
    spend:t==='ad'?+$('fSpend').value||0:0,reach:+$('fReach').value||0,eng:+$('fEng').value||0,msgs:+$('fMsgs').value||0,orders:+$('fOrders').value||0});
  ['fName','fLink','fSpend','fReach','fEng','fMsgs','fOrders'].forEach(function(i){$(i).value=''});
  save();$('form').classList.remove('show');render()};
$('list').onclick=function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-del');

function trRaw(s){var m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return s;
  var o=KM[core];if(o===undefined)for(var i=0;i<RULES.length;i++){var mm=core.match(RULES[i][0]);if(mm){o=RULES[i][1](mm);break}}
  return o===undefined?s:m[1]+o+m[3]}
function tr(s){return LANG==='km'?trRaw(s):s}
function L(s){return tr(s)}
function dateStr(d){var x=new Date(d+'T00:00');return LANG==='km'?x.toLocaleDateString('km-KH',{weekday:'short',year:'numeric',month:'short',day:'numeric'}):x.toDateString()}

var busy=false;
function trText(n){var p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;
  var orig=(n.__t!==undefined&&n.__t===n.nodeValue)?n.__o:n.nodeValue;n.__o=orig;var out=tr(orig);if(out!==n.nodeValue)n.nodeValue=out;n.__t=out}
function trAttrs(el){['placeholder','title'].forEach(function(a){var v=el.getAttribute&&el.getAttribute(a);if(v===null||v===undefined)return;
  var k='__a_'+a,orig=(el[k]&&el[k].t===v)?el[k].o:v,out=tr(orig);if(out!==v)el.setAttribute(a,out);el[k]={o:orig,t:out}})}
function walk(root){if(root.nodeType===3){trText(root);return}if(root.nodeType!==1)return;trAttrs(root);
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),n,list=[];while((n=w.nextNode()))list.push(n);list.forEach(trText);
  [].forEach.call(root.querySelectorAll('[placeholder],[title]'),trAttrs)}
var obs=new MutationObserver(function(ms){if(busy)return;busy=true;
  ms.forEach(function(m){if(m.type==='characterData')trText(m.target);else m.addedNodes.forEach(walk)});busy=false;obs.takeRecords()});
obs.observe(document.body,{childList:true,subtree:true,characterData:true});
function applyLang(){busy=true;document.documentElement.lang=LANG==='km'?'km':'en';render();if($('viewTasks').style.display!=='none')renderTasks();walk(document.body);busy=false;obs.takeRecords()}
var ls=document.createElement('select');ls.id='lang';ls.innerHTML='<option value="en">English</option><option value="km">ខ្មែរ</option>';ls.value=LANG;
ls.onchange=function(){LANG=ls.value;sv('goatMktLang',LANG);applyLang()};
$('gear').parentNode.insertBefore(ls,$('gear'));
render();
if(LANG==='km')walk(document.body);
</script>
