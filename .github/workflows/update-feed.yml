name: Update Facebook Product Feed

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2:00 AM UTC (9:00 AM Cambodia time)
  workflow_dispatch:       # Manual trigger from Actions tab

permissions:
  contents: write          # Required to push feed.xml back to repo

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase
        run: npm install firebase@10

      - name: Generate feed.xml
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: node generate-feed.js

      - name: Commit and push feed.xml
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "🔄 Auto-update Facebook product feed"
          git push
